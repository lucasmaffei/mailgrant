services:
  mailgrant:
    image: ghcr.io/lucasmaffei/mailgrant:latest
    build:
      context: .
    container_name: mailgrant
    restart: unless-stopped
    ports:
      # Loopback by default: put a TLS reverse proxy in front before exposing it.
      - "${BIND:-127.0.0.1}:${PORT:-8000}:8000"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WORKERS: ${WORKERS:-2}
      MAILGRANT_CONFIG: /etc/mailgrant/config.yaml
    volumes:
      - ${MAILGRANT_CONFIG:-./config.yaml}:/etc/mailgrant/config.yaml:ro
      # Used only when the config has a `web:` section (web app state).
      - mailgrant-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  mailgrant-data:
