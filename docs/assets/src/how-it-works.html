<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="readme.css">
<style>
body { width: 1280px; height: 660px; position: relative; overflow: hidden; }
.h { position: absolute; top: 44px; font-size: 14px; color: var(--faint); }
.node { position: absolute; left: 72px; width: 300px; padding: 14px 18px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); z-index: 1; }
.node b { display: block; font-size: 18px; font-weight: 500; }
.node .mono { display: block; margin-top: 6px; font-size: 12px; color: var(--muted); }
.node.you { border-color: rgba(56,207,255,.35); }
.gate { position: absolute; left: 500px; top: 120px; width: 290px; height: 430px; padding: 26px 24px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); z-index: 1; }
.gate .word { font-size: 30px; }
.gate ul { list-style: none; margin-top: 18px; }
.gate li { padding: 13px 0; border-top: 1px solid var(--line); font-size: 15px; line-height: 1.4; color: var(--muted); }
.gate li b { color: var(--text); font-weight: 500; }
.box { position: absolute; left: 920px; width: 290px; height: 64px; padding: 0 18px; display: flex; flex-direction: column; justify-content: center; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); z-index: 1; }
.box b { font-size: 15px; font-weight: 500; }
.box .mono { font-size: 11px; color: var(--faint); margin-top: 3px; }
.box.off { opacity: .45; }
svg.w { position: absolute; inset: 0; }
.denied { position: absolute; z-index: 2; font-size: 12px; color: var(--warn); background: var(--bg); padding: 2px 6px; }
.audit { position: absolute; left: 500px; top: 584px; font-size: 12px; color: var(--faint); line-height: 1.7; }
.audit .d { color: var(--warn); } .audit .ok { color: var(--accent); }
</style></head><body>
<span class="h" id="h0" style="left:72px"></span><span class="h" id="h1" style="left:500px"></span><span class="h" id="h2" style="left:920px"></span>
<div class="node" id="a0" style="top:120px"><b>hermes</b><span class="mono">read · mark · send</span></div>
<div class="node" id="a1" style="top:226px"><b>support-bot</b><span class="mono">read · send</span></div>
<div class="node" id="a2" style="top:332px"><b>finance-bot</b><span class="mono">read</span></div>
<div class="node you" id="a3" style="top:470px"><b id="you"></b><span class="mono" id="yousub"></span></div>
<div class="gate" id="gate"><div class="word">mailgrant<i>.</i></div><ul id="pts"></ul></div>
<div class="box" id="m0" style="top:120px"><b id="b0"></b><span class="mono" id="n0"></span></div>
<div class="box" id="m1" style="top:226px"><b id="b1"></b><span class="mono" id="n1"></span></div>
<div class="box" id="m2" style="top:332px"><b id="b2"></b><span class="mono" id="n2"></span></div>
<div class="box off" id="m3" style="top:438px"><b id="b3"></b><span class="mono" id="n3"></span></div>
<div class="audit mono" id="audit"></div>
<script src="art-text.js"></script>
<script>
const T = A.how;
T.h.forEach((t, i) => document.getElementById('h' + i).textContent = t);
document.getElementById('you').textContent = T.you[0]; document.getElementById('yousub').textContent = T.you[1];
document.getElementById('pts').innerHTML = T.pts.map(([b, r]) => `<li><b>${b}</b> ${r}</li>`).join('');
T.boxes.forEach(([b, n], i) => { document.getElementById('b' + i).textContent = b; document.getElementById('n' + i).textContent = n; });
document.getElementById('audit').innerHTML =
  `{"agent": "finance-bot", "action": "send", "outcome": <span class="d">"denied"</span>, "reason": "scope"}<br>` +
  `{"agent": "hermes", "action": "get_message", "outcome": <span class="ok">"ok"</span>, "mailbox": "lucas"}`;
const NS = 'http://www.w3.org/2000/svg', svg = document.createElementNS(NS, 'svg');
svg.setAttribute('class', 'w'); svg.setAttribute('width', 1280); svg.setAttribute('height', 660); document.body.prepend(svg);
const R = (id) => document.getElementById(id).getBoundingClientRect();
const line = (d, color, dash) => { const p = document.createElementNS(NS, 'path'); p.setAttribute('d', d); p.setAttribute('fill', 'none');
  p.setAttribute('stroke', color); p.setAttribute('stroke-width', 1.5); if (dash) p.setAttribute('stroke-dasharray', dash); svg.appendChild(p); };
const curve = (x1, y1, x2, y2) => `M ${x1} ${y1} C ${(x1 + x2) / 2} ${y1}, ${(x1 + x2) / 2} ${y2}, ${x2} ${y2}`;
const g = R('gate'), cyan = 'rgba(56,207,255,.75)';
[0, 1, 2, 3].forEach((i) => { const r = R('a' + i); line(curve(r.right, r.top + r.height / 2, g.left, g.top + 90 + i * 90), cyan); });
[0, 1, 2].forEach((i) => { const r = R('m' + i); line(curve(g.right, r.top + r.height / 2, r.left, r.top + r.height / 2), cyan); });
const c = R('m3'); line(`M ${g.right} ${c.top + c.height / 2} L ${c.left} ${c.top + c.height / 2}`, 'rgba(255,255,255,.12)', '2 6');
const f = R('a2'); line(`M ${f.right - 40} ${f.bottom} C ${f.right + 20} ${f.bottom + 40}, ${g.left - 70} ${f.bottom + 40}, ${g.left - 6} ${f.bottom + 22}`, '#f5b54a', '5 5');
const tag = document.createElement('span'); tag.className = 'denied mono'; tag.textContent = T.denied; document.body.appendChild(tag);
tag.style.left = (f.right - 150) + 'px'; tag.style.top = (f.bottom + 34) + 'px';
</script></body></html>
