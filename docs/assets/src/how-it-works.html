<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="tokens.css">
<script>
  const q = new URLSearchParams(location.search);
  document.documentElement.dataset.theme = q.get('theme') || 'dark';
  document.documentElement.lang = q.get('lang') || 'en';
</script>
<style>
  body { width: 1280px; height: 600px; overflow: hidden; position: relative; }
  .col-title { position: absolute; top: 40px; font-size: 15px; color: var(--muted); font-weight: 600; }

  .agent { position: absolute; left: 64px; width: 300px; background: var(--paper); color: var(--ink-on-paper); border-radius: 6px 22px 22px 6px; padding: 16px 20px 16px 38px; box-shadow: 0 3px 0 rgba(0,0,0,.2); }
  :root[data-theme="light"] .agent { box-shadow: 0 0 0 1.5px var(--door-edge), 0 3px 0 rgba(20,32,46,.06); }
  .agent::before { content: ''; position: absolute; left: 14px; top: 50%; width: 10px; height: 10px; margin-top: -5px; border-radius: 50%; border: 2.5px solid var(--brass); }
  .agent .who { font-size: 21px; font-weight: 600; }
  .scopes { display: flex; gap: 6px; margin-top: 9px; }
  .scope { font-size: 13px; padding: 3px 9px 4px; border-radius: 999px; border: 1.5px solid #14202e; }
  .scope.no { border: 1.5px dashed #b5c0cc; color: #9aa8b6; }

  .gate { position: absolute; left: 520px; top: 108px; width: 250px; height: 400px; background: var(--door); border: 2px solid var(--door-edge); border-radius: 10px; padding: 26px 24px; }
  .gate .name { display: flex; align-items: center; gap: 10px; font-size: 27px; font-weight: 800; letter-spacing: -.02em; }
  .gate .name svg { width: 34px; height: 34px; }
  .gate ul { list-style: none; margin-top: 22px; }
  .gate li { font-size: 15.5px; line-height: 1.35; color: var(--muted); padding: 11px 0; border-top: 1.5px solid var(--door-edge); }
  .gate li b { color: var(--text); font-weight: 600; }

  .mbox { position: absolute; left: 924px; width: 300px; height: 84px; background: var(--door); border: 2px solid var(--door-edge); border-radius: 8px; display: flex; align-items: center; gap: 16px; padding: 0 18px; }
  .mbox .plate { font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 26px; color: var(--brass); width: 44px; }
  .mbox .addr { font-size: 15px; font-weight: 600; }
  .mbox .note { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .mbox.locked { opacity: .55; }
  .mbox .lock { margin-left: auto; width: 14px; height: 20px; position: relative; }
  .mbox .lock::before { content: ''; position: absolute; left: 2px; top: 0; width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  .mbox .lock::after { content: ''; position: absolute; left: 5px; top: 7px; width: 4px; height: 12px; background: var(--muted); }

  svg.wires { position: absolute; inset: 0; z-index: 0; }
  .agent, .gate, .mbox { z-index: 1; }

  .stamp { position: absolute; z-index: 3; border: 3px solid var(--denied); color: var(--denied); border-radius: 10px; padding: 5px 11px 6px; transform: rotate(-7deg); white-space: nowrap; background: color-mix(in srgb, var(--lobby) 88%, transparent); }
  .stamp .big { font-size: 20px; font-weight: 800; letter-spacing: .01em; line-height: 1.05; }
  .stamp .small { font-size: 12.5px; font-weight: 600; }

  .audit { position: absolute; left: 520px; top: 528px; width: 696px; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 13px; color: var(--muted); }
  .audit .d { color: var(--denied); }
  .audit .ok { color: var(--granted); }
</style></head>
<body>
  <div class="col-title" style="left:64px" id="t0"></div>
  <div class="col-title" style="left:520px" id="t1"></div>
  <div class="col-title" style="left:924px" id="t2"></div>

  <div class="agent" id="a0" style="top:120px"><div class="who"></div><div class="scopes"></div></div>
  <div class="agent" id="a1" style="top:262px"><div class="who"></div><div class="scopes"></div></div>
  <div class="agent" id="a2" style="top:404px"><div class="who"></div><div class="scopes"></div></div>

  <div class="gate" id="gate">
    <div class="name"><svg viewBox="0 0 64 64"><rect x="3" y="3" width="58" height="58" rx="10" fill="var(--lobby)" stroke="var(--door-edge)" stroke-width="3"/><circle cx="32" cy="27" r="9" fill="var(--brass)"/><rect x="28.5" y="31" width="7" height="18" rx="2" fill="var(--brass)"/></svg>mailgrant</div>
    <ul id="points"></ul>
  </div>

  <div class="mbox" id="m0" style="top:108px"><span class="plate">101</span><div><div class="addr"></div><div class="note"></div></div></div>
  <div class="mbox" id="m1" style="top:212px"><span class="plate">102</span><div><div class="addr"></div><div class="note"></div></div></div>
  <div class="mbox" id="m2" style="top:316px"><span class="plate">103</span><div><div class="addr"></div><div class="note"></div></div></div>
  <div class="mbox locked" id="m3" style="top:420px"><span class="plate">104</span><div><div class="addr"></div><div class="note"></div></div><span class="lock"></span></div>

  <div class="audit" id="audit"></div>

<script>
  const T = {
    en: {
      titles: ['Agents, one token each', 'The gateway', 'Your mailboxes'],
      agents: ['support-bot', 'finance-bot', 'assistant'],
      points: [
        ['Checks every call', "against the token's mailboxes and scopes."],
        ['Hides the rest.', "Mailboxes outside a grant look like they don't exist."],
        ['Keeps the passwords.', 'Agents never see them.'],
        ['Writes an audit line', 'for each operation.'],
      ],
      boxes: [['contact@example.com', 'support-bot, assistant'], ['billing@example.com', 'finance-bot, assistant'],
              ['ops@example.com', 'assistant'], ['ceo@example.com', 'no agent granted']],
      stamp: ['denied', 'no send scope'],
    },
    'pt-BR': {
      titles: ['Agentes, um token cada', 'O gateway', 'Suas caixas'],
      agents: ['atendimento', 'financeiro', 'assistente'],
      points: [
        ['Confere toda chamada', 'contra as caixas e os escopos do token.'],
        ['Esconde o resto.', 'Caixas fora da permissão parecem não existir.'],
        ['Guarda as senhas.', 'Os agentes nunca as veem.'],
        ['Registra cada operação', 'numa linha de auditoria.'],
      ],
      boxes: [['contato@loja.com.br', 'atendimento, assistente'], ['financeiro@loja.com.br', 'financeiro, assistente'],
              ['ops@loja.com.br', 'assistente'], ['diretoria@loja.com.br', 'nenhum agente liberado']],
      stamp: ['negado', 'sem o escopo send'],
    },
  }[document.documentElement.lang];
  T.titles.forEach((t, i) => document.getElementById('t' + i).textContent = t);
  T.agents.forEach((t, i) => document.querySelector(`#a${i} .who`).textContent = t);
  document.getElementById('points').innerHTML = T.points.map(([b, r]) => `<li><b>${b}</b> ${r}</li>`).join('');
  T.boxes.forEach(([a, n], i) => {
    document.querySelector(`#m${i} .addr`).textContent = a;
    document.querySelector(`#m${i} .note`).textContent = n;
  });

  const ALL = ['read', 'mark', 'delete', 'send'];
  const agents = [
    { scopes: ['read', 'mark', 'send'], boxes: [0] },
    { scopes: ['read'], boxes: [1] },
    { scopes: ['read', 'mark', 'delete', 'send'], boxes: [0, 1, 2] },
  ];
  agents.forEach((a, i) => {
    document.querySelector(`#a${i} .scopes`).innerHTML =
      ALL.map(s => `<span class="scope ${a.scopes.includes(s) ? '' : 'no'}">${s}</span>`).join('');
  });

  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('class', 'wires'); svg.setAttribute('width', 1280); svg.setAttribute('height', 600);
  document.body.prepend(svg);
  const rect = id => document.getElementById(id).getBoundingClientRect();
  const path = (d, color, dash) => {
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', d); p.setAttribute('fill', 'none'); p.setAttribute('stroke', color);
    p.setAttribute('stroke-width', 3); p.setAttribute('stroke-linecap', 'round');
    if (dash) p.setAttribute('stroke-dasharray', dash);
    svg.appendChild(p);
  };
  const curve = (x1, y1, x2, y2) => `M ${x1} ${y1} C ${(x1 + x2) / 2} ${y1}, ${(x1 + x2) / 2} ${y2}, ${x2} ${y2}`;
  const gate = rect('gate');
  const brass = 'var(--brass)', red = 'var(--denied)';

  // agent -> gateway, entering at evenly spaced ports
  agents.forEach((a, i) => {
    const r = rect(`a${i}`);
    const portY = gate.top + 110 + i * 100;
    path(curve(r.right, r.top + r.height / 2, gate.left, portY), brass);
  });
  // gateway -> granted mailboxes
  [0, 1, 2].forEach(m => {
    const r = rect(`m${m}`);
    path(curve(gate.right, r.top + r.height / 2, r.left, r.top + r.height / 2), brass);
  });
  // nothing reaches ceo@
  const ceo = rect('m3');
  path(curve(gate.right, ceo.top + ceo.height / 2, ceo.left - 40, ceo.top + ceo.height / 2), 'var(--door-edge)', '2 9');

  // finance-bot tries to send: stopped at the gateway
  const fin = rect('a1');
  const sy = fin.top + fin.height / 2 + 30;
  path(`M ${fin.right - 30} ${fin.bottom} C ${fin.right + 40} ${sy + 34}, ${gate.left - 90} ${sy + 34}, ${gate.left - 8} ${sy + 24}`, red, '7 7');
  const stamp = document.createElement('div');
  stamp.className = 'stamp';
  stamp.innerHTML = `<div class="big">${T.stamp[0]}</div><div class="small">${T.stamp[1]}</div>`;
  document.body.appendChild(stamp);
  stamp.style.left = (gate.left - 158) + 'px';
  stamp.style.top = (fin.bottom + 22) + 'px';

  document.getElementById('audit').innerHTML =
    `{"agent": "${T.agents[1]}", "action": "send", "outcome": <span class="d">"denied"</span>, "reason": "scope"}<br>` +
    `{"agent": "${T.agents[2]}", "action": "get_message", "outcome": <span class="ok">"ok"</span>, "mailbox": "ops"}`;
</script>
</body></html>
