<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="readme.css">
<style>
body { width: 1280px; padding: 56px 64px 52px; }
.row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 36px; }
figure { display: flex; flex-direction: column; gap: 16px; }
figcaption { font-size: 15px; color: var(--muted); line-height: 1.4; }
figcaption b { display: block; color: var(--text); font-weight: 500; margin-bottom: 2px; }
.phone { border-radius: 30px; box-shadow: none; }
</style></head><body>
<div class="row" id="row"></div>
<script>
const pt = new URLSearchParams(location.search).get('lang') === 'pt-BR';
const items = [
  ['02-entrada.png', pt ? ['Uma caixa de entrada', 'Todas as caixas juntas, com o que cada agente já fez.'] : ['One inbox', 'Every mailbox together, with what each agent already did.']],
  ['03-mensagem.png', pt ? ['Leitura limpa', 'HTML vira texto. Responder entra na mesma conversa.'] : ['Clean reading', 'HTML becomes text. Replies stay in the thread.']],
  ['05-agentes.png', pt ? ['Agentes', 'Quem leu, enviou ou foi barrado, e quando.'] : ['Agents', 'Who read, sent or got denied, and when.']],
  ['06-ajustes.png', pt ? ['Push e passkeys', 'Escolha as caixas que notificam. Sem senha.'] : ['Push and passkeys', 'Pick the mailboxes that notify. No password.']],
];
document.getElementById('row').innerHTML = items.map(([img, [t, d]]) =>
  `<figure><div class="phone"><img src="shots/${img}" alt=""></div><figcaption><b>${t}</b>${d}</figcaption></figure>`).join('');
</script></body></html>
