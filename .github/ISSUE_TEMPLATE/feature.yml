name: Feature request
description: Something mailgrant could do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How it could work. Mention which side it touches (agents/MCP, REST, web app).
  - type: textarea
    id: else
    attributes:
      label: Alternatives you considered
