[project]
name = "mailgrant"
version = "0.9.0"
description = "One email gateway for many AI agents: per-token mailboxes and scopes over MCP and REST."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Lucas Maffei" }]
keywords = [
    "imap",
    "smtp",
    "email",
    "mailbox",
    "ai-agents",
    "permissions",
    "fastapi",
    "mcp",
    "model-context-protocol",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "fastapi==0.136.1",
    "uvicorn[standard]==0.46.0",
    "pydantic==2.13.3",
    "pyyaml==6.0.3",
    "mcp==1.28.1",
    "html2text==2024.2.26",
    "pyjwt==2.15.1",
    "webauthn==3.0.1",
    "pywebpush==2.5.0",
    "cryptography==50.0.0",
]

[project.urls]
Homepage = "https://github.com/lucasmaffei/mailgrant"
Issues = "https://github.com/lucasmaffei/mailgrant/issues"
Upstream = "https://github.com/psyb0t/docker-mailbox"

[project.scripts]
mailgrant = "mailgrant.cli:main"

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "httpx==0.28.1",
    "black==26.3.1",
    "isort==5.13.2",
    "flake8==7.1.1",
    "mypy==1.13.0",
    "types-pyyaml==6.0.12.20240917",
    "testcontainers==4.14.2",
    "requests==2.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailgrant"]

[tool.uv]
# Supply-chain defense: only install pkg versions older than `exclude-newer`.
# Refreshed by make pkg-* to UTC midnight seven days before the operation.
exclude-newer = "2026-10-06T00:00:00Z"

[tool.isort]
profile = "black"
line_length = 100

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -m 'not docker'"
markers = [
    "docker: integration tests that build + run the docker image (opt-in: pytest -m docker)",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
